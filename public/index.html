<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS to Solidity Compiler - VS Code Style</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header/Top Bar -->
    <div class="top-bar">
        <div class="logo-section">
            <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 22 7 22 17 12 22 2 17 2 7 12 2"></polygon>
            </svg>
            <span class="title">JS to Solidity Compiler</span>
        </div>
        <div class="status-bar">
            <span class="status-item">
                <span class="status-dot"></span>
                <span id="status-text">Ready</span>
            </span>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="12 3 20 7.5 20 16.5 12 21 4 16.5 4 7.5 12 3"></polyline>
                    </svg>
                    <span>Compiler</span>
                </div>
                <div class="info-panel">
                    <div class="info-item">
                        <span class="info-label">Status:</span>
                        <span class="info-value" id="compile-status">Ready</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Version:</span>
                        <span class="info-value">0.8.0+</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    <span>Templates</span>
                </div>
                <div class="template-buttons">
                    <button class="template-btn" onclick="loadTemplate('calculator')">
                        <span>Calculator</span>
                    </button>
                    <button class="template-btn" onclick="loadTemplate('counter')">
                        <span>Counter</span>
                    </button>
                    <button class="template-btn" onclick="loadTemplate('bank')">
                        <span>Bank</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Editor Area -->
        <div class="editor-container">
            <!-- Left Panel: Code Input -->
            <div class="panel left-panel">
                <div class="panel-header">
                    <span class="panel-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                        <span>JavaScript Input</span>
                    </span>
                    <div style="display: flex; gap: 4px;">
                        <button class="header-btn" title="Save JavaScript" onclick="saveJavaScriptFile()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                                <polyline points="7 3 7 8 15 8"></polyline>
                            </svg>
                        </button>
                        <button class="header-btn" title="Clear">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" onclick="clearCode()">
                                <path d="M3 6h18"></path>
                                <path d="M8 6v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V6m-4-1V3a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <textarea 
                        id="code-input" 
                        class="code-editor" 
                        placeholder="Write your JavaScript code here...
// Example:
class Counter {
  constructor() {
    this.count = 0;
  }
  
  increment() {
    this.count++;
  }
}"></textarea>
                    <div class="line-numbers" id="line-numbers"></div>
                </div>
            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Right Panel: Output -->
            <div class="panel right-panel">
                <div class="panel-header">
                    <span class="panel-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                            <path d="M21 3v5h-5"></path>
                            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                            <path d="M3 21v-5h5"></path>
                        </svg>
                        <span>Solidity Output</span>
                    </span>
                    <button class="header-btn" title="Copy to Clipboard" onclick="copyOutput()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 4h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        </svg>
                    </button>
                </div>
                <div class="output-container" id="output-container">
                    <div class="output-placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="1"></circle>
                            <path d="M12 1v6m0 6v6"></path>
                            <path d="M4.22 4.22l4.24 4.24m-4.24 7.08l4.24 4.24"></path>
                            <path d="M1 12h6m6 0h6"></path>
                            <path d="M4.22 19.78l4.24-4.24m7.08 4.24l4.24-4.24"></path>
                        </svg>
                        <p>Click "Convert" to compile your JavaScript</p>
                    </div>
                    <div class="code-output" id="code-output" style="display: none;">
                        <pre><code id="solidity-code"></code></pre>
                    </div>
                    <div class="errors-container" id="errors-container" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Action Bar -->
    <div class="action-bar">
        <button class="btn btn-primary" onclick="compileCode()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 6 13.5 15.5 8 10 1 17"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
            <span>Convert to Solidity</span>
        </button>
        <div style="flex: 1;"></div>
        <div class="stats-display">
            <span class="stat" id="stat-tokens">Tokens: 0</span>
            <span class="stat" id="stat-nodes">AST Nodes: 0</span>
            <span class="stat" id="stat-errors">Errors: 0</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
